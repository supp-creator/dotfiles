[main]
# monitor =

font=JetBrainsMono Nerd Font:size=11
dpi-aware=yes

prompt="Search: "
show-icons=yes

fields=name,generic,comment,exec
terminal=kitty 
width=30
lines=20
horizontal-pad=24
vertical-pad=15
inner-pad=8

icons-theme=Papirus-Dark

image-size-ratio=0.5


sort-result=yes 
match-mode=fzf

[colors]
# Format is RRGGBBAA
background=0B1E2DE6
text=E8F3F3FF
match=7FCDC4FF
selection=1D4560FF
selection-text=E8F3F3FF
selection-match=2E86ABFF
border=2E86ABFF

[border]
width=2
radius=8

[dmenu]
mode=index
exit-immediately-if-empty=no
